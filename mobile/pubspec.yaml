name: cloudfusion_mobile
description: >-
  CloudFusion Android client — a lightweight remote control for zero-local
  cloud transfers. This app NEVER downloads remote file bytes to the device;
  the backend streams SOURCE -> DRIVE and this UI only exchanges JSON metadata.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
