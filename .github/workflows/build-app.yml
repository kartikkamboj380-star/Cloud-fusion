name: build-app

# Actions tab → "build-app" → Run workflow.
#
# Turns this repo's own source into downloadable, installable builds:
#   cloudfusion-web → standalone Next.js server bundle (zip, runnable)
#   cloudfusion-apk → Android debug APK(s) for the Flutter client
#
# Also runs on every push to main that touches the app source.
on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend URL baked into the APK (leave empty to type it in the app)"
        required: false
        default: ""
      build_web:
        description: "Build the web console artifact"
        type: boolean
        default: true
      build_apk:
        description: "Build the Android APK artifact"
        type: boolean
        default: true
      publish_release:
        description: "Publish the APKs as a GitHub Release (installable link for phones)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "src/**"
      - "mobile/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - ".github/workflows/build-app.yml"

permissions:
  contents: write

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web console (Next.js)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_web }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type generation
        run: npx next typegen

      - name: Strict typecheck
        run: npx tsc --noEmit --pretty false

      - name: Engine unit tests (SSRF guard, allocator)
        run: npx tsx --test src/lib/engine/__tests__/*.test.ts

      - name: Lint
        run: npm run lint

      - name: Production build (standalone)
        run: npm run build
        env:
          # Placeholders only: route modules are initialised at build time,
          # no database or real secret is used.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/build_stub
          APP_SECRET: ci-placeholder-not-a-secret
          TOKEN_ENCRYPTION_KEY: ci-placeholder-not-a-secret

      - name: Assemble runnable artifact
        run: |
          set -euo pipefail
          OUT=dist/cloudfusion-web
          mkdir -p "$OUT/.next"
          cp -r .next/standalone/. "$OUT"/
          cp -r .next/static "$OUT/.next/static"
          if [ -d public ]; then cp -r public "$OUT/public"; fi
          if [ -d docs ]; then cp -r docs "$OUT/docs"; fi
          cp docs/RUN-ARTIFACT.md "$OUT/README.md"
          ( cd dist && zip -qr cloudfusion-web.zip cloudfusion-web )
          ls -lh dist/cloudfusion-web.zip

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudfusion-web
          path: dist/cloudfusion-web.zip
          retention-days: 14

  apk:
    name: Android APK (Flutter)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_apk }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android project scaffolding
        run: |
          set -euo pipefail
          # This repo ships the Dart sources only; generate the Gradle wrapper
          # on demand so the artifact is reproducible without checked-in
          # generated files. Copied from a temp dir so lib/ and test/ are
          # never overwritten.
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name cloudfusion_mobile --org app.cloudfusion /tmp/cf_scaffold >/dev/null
            cp -r /tmp/cf_scaffold/android ./android
          fi
          # Debug builds are expected to reach a self-hosted relay over plain
          # HTTP (dev laptops / LAN). Release builds keep the platform default.
          DEBUG_MANIFEST=android/app/src/debug/AndroidManifest.xml
          if [ -f "$DEBUG_MANIFEST" ] && ! grep -q usesCleartextTraffic "$DEBUG_MANIFEST"; then
            sed -i 's|</manifest>|    <application android:usesCleartextTraffic="true" />\n</manifest>|' "$DEBUG_MANIFEST"
          fi
          grep -c usesCleartextTraffic "$DEBUG_MANIFEST" || true
          echo "Flutter: $(flutter --version | head -1)"
          echo "Java: $(java -version 2>&1 | head -1)"
          echo "--- gradle-wrapper.properties ---"
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Pre-cache Gradle distribution
        # The generated wrapper points at a GitHub release asset that the runner
        # occasionally fails to download. Fetch the distribution ourselves (with
        # retries + mirrors) and pin the wrapper to the local file so the APK
        # build never depends on that download succeeding.
        run: |
          set -euo pipefail
          WRAPPER=android/gradle/wrapper/gradle-wrapper.properties
          # Gradle escapes the scheme separator in the properties file (https\://)
          URL=$(grep -oE 'https[^[:space:]]+\.zip' "$WRAPPER" | head -1 | sed 's/\\:/:/g')
          VER=$(basename "$URL" | sed -E 's/^gradle-([0-9.]+)(-.*)?\.zip$/\1/')
          FLAVOUR=$(basename "$URL" | sed -E 's/^gradle-[0-9.]+-(.*)\.zip$/\1/')
          echo "wrapper wants gradle $VER ($FLAVOUR): $URL"

          DEST=/tmp/gradle-dist.zip
          OK=0
          for CAND in \
            "https://downloads.gradle.org/distributions/gradle-$VER-$FLAVOUR.zip" \
            "https://services.gradle.org/distributions/gradle-$VER-$FLAVOUR.zip" \
            "https://downloads.gradle.org/distributions/gradle-$VER-bin.zip" \
            "$URL"; do
            echo "trying $CAND"
            if curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
                 --connect-timeout 20 --max-time 600 -o "$DEST" "$CAND"; then
              if unzip -tq "$DEST" >/dev/null 2>&1; then OK=1; echo "downloaded from $CAND"; break; fi
              echo "  corrupt archive, next mirror"
            fi
          done
          if [ "$OK" != "1" ]; then echo "::error::could not fetch a Gradle distribution"; exit 1; fi

          { grep -v '^distributionUrl=' "$WRAPPER" || true; echo "distributionUrl=file\:${DEST}"; } > "$WRAPPER.tmp"
          mv "$WRAPPER.tmp" "$WRAPPER"
          cat "$WRAPPER"

      - name: Report Android SDK levels
        # Docs/release notes claim a minimum Android version — print the truth
        # from the generated Gradle config so the claim is verifiable.
        run: |
          set -euo pipefail
          grep -rn "minSdk\|targetSdk\|compileSdk" android/app/build.gradle.kts || true
          FLUTTER_ROOT=$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")
          grep -rn "minSdkVersion\|targetSdkVersion\|compileSdkVersion" \
            "$FLUTTER_ROOT/packages/flutter_tools/gradle" 2>/dev/null | head -20 || true

      - name: Resolve packages
        run: flutter pub get

      - name: Static analysis
        # Errors stay fatal; info-level lints (deprecations) do not fail the build.
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test

      - name: Build debug APK (split per ABI)
        env:
          CF_BACKEND_URL: ${{ inputs.backend_url }}
        run: |
          set -uo pipefail
          ATTEMPT=1
          while [ "$ATTEMPT" -le 3 ]; do
            echo "=== flutter build apk attempt $ATTEMPT ==="
            if [ -n "${CF_BACKEND_URL:-}" ]; then
              flutter build apk --debug --split-per-abi --dart-define=CF_BACKEND_URL="$CF_BACKEND_URL" 2>&1 | tee /tmp/apk-build.log
            else
              flutter build apk --debug --split-per-abi 2>&1 | tee /tmp/apk-build.log
            fi
            STATUS=${PIPESTATUS[0]}
            if [ "$STATUS" -eq 0 ]; then break; fi
            echo "attempt $ATTEMPT failed (exit $STATUS)"
            ATTEMPT=$((ATTEMPT + 1))
            sleep 15
          done
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::flutter build apk failed after $((ATTEMPT - 1)) attempts"
            tail -60 /tmp/apk-build.log
            exit 1
          fi
          # Fixed, predictable names so the downloaded files are self-explanatory.
          cd build/app/outputs/flutter-apk
          for f in app-*.apk; do
            case "$f" in
              *arm64*) cp "$f" cloudfusion-arm64-v8a.apk ;;
              *armeabi*) cp "$f" cloudfusion-armeabi-v7a.apk ;;
              *x86_64*) cp "$f" cloudfusion-x86_64.apk ;;
            esac
          done
          ls -lh cloudfusion-*.apk

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/*.apk ../dist/
          ls -lh ../dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudfusion-apk
          path: dist/*.apk
          retention-days: 14

      # Artifacts need a GitHub login to download; the phone needs a plain link.
      # Publishing a Release gives a permanent, tappable .apk URL.
      - name: Publish APKs as a Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CloudFusion APK build ${{ github.run_number }}
          body: |
            Installable Android debug build of the CloudFusion client.

            Runs on any device supported by the current Flutter stable release
            (Android 5.0+ in practice) — **Android 12 is fully supported**.
            Min/target SDK levels are printed in the job log under
            *Report Android SDK levels*.

            | File | Which phone |
            |---|---|
            | `cloudfusion-arm64-v8a.apk` | Almost every phone from ~2016 onward (Snapdragon/Exynos/MediaTek 64-bit) — **use this one** |
            | `cloudfusion-armeabi-v7a.apk` | Older 32-bit devices only |
            | `cloudfusion-x86_64.apk` | Emulators / x86 tablets |

            After install, open the app and set **Relay URL** to your CloudFusion
            backend (e.g. `http://192.168.1.5:3000` on the same Wi-Fi, or your
            deployed `https://` URL), then tap **Use demo session**.
          files: |
            dist/cloudfusion-arm64-v8a.apk
            dist/cloudfusion-armeabi-v7a.apk
            dist/cloudfusion-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
